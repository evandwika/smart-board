<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sb75Screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051336"/>
      <stop offset="100%" stop-color="#002B9A"/>
    </linearGradient>
    <filter id="shadow75" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#002B9A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Trolley Base -->
  <path d="M 180 415 L 215 320 L 385 320 L 420 415 Z" fill="#1E293B"/>
  <ellipse cx="175" cy="420" rx="16" ry="6" fill="#0F172A"/>
  <ellipse cx="425" cy="420" rx="16" ry="6" fill="#0F172A"/>
  <rect x="280" y="260" width="40" height="70" fill="#334155" rx="4"/>

  <!-- Screen Outer Bezel -->
  <rect x="50" y="40" width="500" height="280" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2" filter="url(#shadow75)"/>
  <rect x="58" y="48" width="484" height="254" rx="8" fill="url(#sb75Screen)"/>

  <!-- Top Camera Bar -->
  <rect x="250" y="42" width="100" height="10" rx="4" fill="#070D1E"/>
  <circle cx="300" cy="47" r="2.5" fill="#38BDF8"/>

  <!-- On Screen Visual -->
  <text x="80" y="90" font-family="Manrope, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">SMART BOARD 75" PRO</text>
  <text x="80" y="115" font-family="Poppins, sans-serif" font-size="12" fill="#BAE6FD">Paling Laris: Ruang Rapat Kantor, BUMN &amp; Kelas Kampus</text>

  <!-- Spec cards -->
  <rect x="80" y="135" width="200" height="100" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1"/>
  <text x="96" y="165" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#60A5FA">Fitur Unggulan:</text>
  <text x="96" y="185" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">• 48MP AI Tracking Camera</text>
  <text x="96" y="205" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">• 8-Array Noise-Canceling Mic</text>
  <text x="96" y="223" font-family="Poppins, sans-serif" font-size="10" fill="#93C5FD">• Zero-Gap Touch Bonding</text>

  <rect x="295" y="135" width="225" height="100" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#34D399" stroke-width="1"/>
  <text x="310" y="165" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#34D399">Kapasitas &amp; Legalitas:</text>
  <text x="310" y="185" font-family="Poppins, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">10 - 25 Peserta</text>
  <text x="310" y="205" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">Tersedia E-Katalog LKPP Resmi</text>
  <text x="310" y="223" font-family="Poppins, sans-serif" font-size="10" fill="#BBF7D0">Sertifikat TKDN &amp; Garansi 3 Thn</text>

  <!-- Bottom soundbar -->
  <rect x="58" y="302" width="484" height="18" fill="#070D1E" rx="3"/>
  <circle cx="80" cy="311" r="3" fill="#10B981"/>
  <text x="300" y="313" font-family="Manrope, sans-serif" font-weight="700" font-size="8" fill="#94A3B8" text-anchor="middle">CAHAYA MUSTIKA 75-PRO INTERACTIVE</text>

  <!-- Best Seller Badge -->
  <g transform="translate(410, 26)">
    <rect width="115" height="34" rx="17" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="57" y="22" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">BEST SELLER</text>
  </g>
</svg>
