<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#bgGrad)"/>

  <!-- Trolley Visual -->
  <g transform="translate(40, 50)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Trolley icon -->
    <path d="M 60 135 L 75 40 L 165 40 L 180 135 Z" fill="#334155"/>
    <rect x="100" y="55" width="40" height="30" rx="4" fill="#002B9A"/>
    <ellipse cx="55" cy="140" rx="12" ry="5" fill="#0F172A"/>
    <ellipse cx="185" cy="140" rx="12" ry="5" fill="#0F172A"/>
    <text x="120" y="115" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#051336" text-anchor="middle">Heavy Duty Mobile Trolley</text>
    <text x="120" y="132" font-family="Poppins, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Kapasitas beban hingga 150kg</text>
  </g>

  <!-- OPS Module PC Visual -->
  <g transform="translate(320, 50)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="35" width="120" height="65" rx="6" fill="#0F172A"/>
    <rect x="70" y="45" width="30" height="10" rx="2" fill="#3B82F6"/>
    <circle cx="160" cy="50" r="4" fill="#10B981"/>
    <!-- Heat sink lines -->
    <line x1="70" y1="65" x2="170" y2="65" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="75" x2="170" y2="75" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="85" x2="170" y2="85" stroke="#334155" stroke-width="2"/>
    <text x="120" y="125" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#051336" text-anchor="middle">OPS PC Windows 11 Pro</text>
    <text x="120" y="142" font-family="Poppins, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Intel Core i5 / i7 • RAM 16GB</text>
  </g>

  <!-- 4K PTZ Camera Visual -->
  <g transform="translate(40, 240)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="120" cy="70" r="32" fill="#0F172A"/>
    <circle cx="120" cy="70" r="20" fill="#1E293B"/>
    <circle cx="120" cy="70" r="10" fill="#002B9A"/>
    <circle cx="116" cy="66" r="3" fill="#38BDF8"/>
    <rect x="80" y="95" width="80" height="15" rx="4" fill="#334155"/>
    <text x="120" y="130" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#051336" text-anchor="middle">4K AI Auto-Tracking Camera</text>
    <text x="120" y="147" font-family="Poppins, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">120° FOV • Voice Locator 8-Mic</text>
  </g>

  <!-- Magnetic Stylus & Wireless Dongle Visual -->
  <g transform="translate(320, 240)">
    <rect width="240" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Stylus -->
    <rect x="50" y="55" width="140" height="12" rx="6" fill="#1E293B" transform="rotate(-15 120 60)"/>
    <!-- Dongle -->
    <circle cx="120" cy="90" r="16" fill="#002B9A"/>
    <rect x="117" y="70" width="6" height="8" rx="1" fill="#94A3B8"/>
    <text x="120" y="130" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#051336" text-anchor="middle">Smart Pen &amp; Wireless Dongle</text>
    <text x="120" y="147" font-family="Poppins, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Plug &amp; Share Screen 1-Click</text>
  </g>
</svg>
