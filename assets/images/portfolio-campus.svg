<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallCampus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#wallCampus)"/>
  <rect x="0" y="310" width="600" height="90" fill="#94A3B8"/>

  <!-- Installed 75" Smart Board on Mobile Trolley in Classroom -->
  <!-- Trolley legs -->
  <path d="M 230 350 L 255 250 L 345 250 L 370 350 Z" fill="#1E293B"/>
  <ellipse cx="225" cy="355" rx="14" ry="5" fill="#0F172A"/>
  <ellipse cx="375" cy="355" rx="14" ry="5" fill="#0F172A"/>

  <!-- Screen Frame -->
  <rect x="150" y="50" width="300" height="180" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="156" y="56" width="288" height="168" rx="4" fill="#FFFFFF"/>

  <!-- Classroom math / chemistry notes on smart board -->
  <text x="300" y="85" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="#002B9A" text-anchor="middle">SMART CLASSROOM UNIVERSITAS</text>
  <text x="300" y="105" font-family="Poppins, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Kuliah Interaktif Hybrid &amp; Laboratorium</text>
  <!-- Formula sketches -->
  <text x="180" y="140" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#2563EB">E = mc²</text>
  <text x="260" y="140" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#059669">f(x) = ∫ sin(x) dx</text>
  <path d="M 180 160 Q 230 190 320 160 T 410 180" fill="none" stroke="#DC2626" stroke-width="2"/>

  <!-- Lecturer Podium -->
  <rect x="420" y="240" width="60" height="100" fill="#475569" rx="4"/>

  <!-- Student Desks in foreground -->
  <rect x="60" y="320" width="120" height="50" rx="6" fill="#1E293B"/>
  <rect x="240" y="320" width="120" height="50" rx="6" fill="#1E293B"/>
  <rect x="420" y="320" width="120" height="50" rx="6" fill="#1E293B"/>

  <!-- Badge -->
  <g transform="translate(20, 20)">
    <rect width="180" height="32" rx="6" fill="#2563EB"/>
    <text x="90" y="21" font-family="Manrope, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">UNIVERSITAS &amp; KAMPUS</text>
  </g>
</svg>
