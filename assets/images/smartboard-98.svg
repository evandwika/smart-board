<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sb98Screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#02143D"/>
    </linearGradient>
    <filter id="shadow98" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#002B9A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Heavy Duty Industrial Stand -->
  <path d="M 140 425 L 185 305 L 415 305 L 460 425 Z" fill="#0F172A"/>
  <ellipse cx="135" cy="430" rx="20" ry="7" fill="#000000"/>
  <ellipse cx="465" cy="430" rx="20" ry="7" fill="#000000"/>
  <rect x="250" y="240" width="40" height="75" fill="#1E293B" rx="3"/>
  <rect x="310" y="240" width="40" height="75" fill="#1E293B" rx="3"/>

  <!-- Screen Outer Bezel (Ultra thin premium edge) -->
  <rect x="20" y="24" width="560" height="312" rx="16" fill="#000000" stroke="#334155" stroke-width="2" filter="url(#shadow98)"/>
  <rect x="26" y="30" width="548" height="288" rx="10" fill="url(#sb98Screen)"/>

  <!-- On Screen Visual -->
  <text x="50" y="75" font-family="Manrope, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">SMART BOARD 98" CINEMA MAX</text>
  <text x="50" y="100" font-family="Poppins, sans-serif" font-size="12" fill="#60A5FA">Auditorium, Ballroom, Command Center &amp; Hall Utama</text>

  <!-- Specs grid -->
  <rect x="50" y="120" width="240" height="120" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#002B9A" stroke-width="1.5"/>
  <text x="66" y="150" font-family="Manrope, sans-serif" font-weight="700" font-size="13" fill="#60A5FA">Ukuran Raksasa 2.2 x 1.3 Meter</text>
  <text x="66" y="172" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">• 500 nits High Brightness Anti-Glare</text>
  <text x="66" y="192" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">• 4K UHD 1.07 Billion Colors DCI-P3</text>
  <text x="66" y="212" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">• Optical Bonding - No Parallax Error</text>
  <text x="66" y="230" font-family="Poppins, sans-serif" font-size="10" fill="#93C5FD">• Built-in 4K AI Tracking PTZ Interface</text>

  <rect x="305" y="120" width="240" height="120" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="150" font-family="Manrope, sans-serif" font-weight="700" font-size="13" fill="#34D399">Cocok Untuk Ruang Skala Besar</text>
  <text x="320" y="172" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">50 - 200+ Peserta</text>
  <text x="320" y="192" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">Jarak Pandang: 8 - 25 Meter</text>
  <text x="320" y="212" font-family="Poppins, sans-serif" font-size="11" fill="#FFFFFF">Tersedia Custom Mounting / Standing</text>
  <text x="320" y="230" font-family="Poppins, sans-serif" font-size="10" fill="#BBF7D0">E-Katalog LKPP &amp; Dukungan Penuh SPK</text>

  <!-- Bottom Soundbar -->
  <rect x="26" y="318" width="548" height="18" fill="#050811" rx="2"/>
  <circle cx="45" cy="327" r="3" fill="#10B981"/>
  <text x="300" y="329" font-family="Manrope, sans-serif" font-weight="700" font-size="8.5" fill="#64748B" text-anchor="middle">CAHAYA MUSTIKA 98-COLOSSUS GRAND EDITION</text>

  <!-- Badge -->
  <g transform="translate(420, 16)">
    <rect width="145" height="34" rx="17" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text x="72" y="22" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">AUDITORIUM 98"</text>
  </g>
</svg>
