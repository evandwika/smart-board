<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="brandNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B9A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002B9A" flood-opacity="0.15"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mobile Trolley Stand Base -->
  <g id="trolley-stand">
    <!-- Base legs -->
    <path d="M 280 620 L 330 520 L 670 520 L 720 620 Z" fill="#1E293B" opacity="0.9"/>
    <ellipse cx="270" cy="625" rx="22" ry="9" fill="#0F172A"/>
    <ellipse cx="730" cy="625" rx="22" ry="9" fill="#0F172A"/>
    <ellipse cx="400" cy="625" rx="18" ry="7" fill="#0F172A"/>
    <ellipse cx="600" cy="625" rx="18" ry="7" fill="#0F172A"/>
    
    <!-- Vertical dual columns -->
    <rect x="440" y="440" width="30" height="90" fill="url(#standGrad)" rx="4"/>
    <rect x="530" y="440" width="30" height="90" fill="url(#standGrad)" rx="4"/>
    
    <!-- Accessory shelf -->
    <rect x="360" y="480" width="280" height="12" fill="#0F172A" rx="4"/>
    <rect x="420" y="468" width="80" height="12" fill="#3B82F6" rx="2" opacity="0.8"/>
  </g>

  <!-- Smart Board Main Body Frame -->
  <g id="screen-frame" filter="url(#shadowHeavy)">
    <!-- Outer Bezel -->
    <rect x="60" y="40" width="880" height="520" rx="16" fill="url(#bezelGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Inner Bezel Accent line -->
    <rect x="68" y="48" width="864" height="476" rx="10" fill="#051336"/>

    <!-- Screen Display Area (16:9 4K Anti-Glare) -->
    <rect x="74" y="54" width="852" height="464" rx="6" fill="url(#screenGrad)"/>

    <!-- Top Integrated Camera & Mic Bar -->
    <rect x="430" y="42" width="140" height="12" rx="4" fill="#090E17"/>
    <circle cx="500" cy="48" r="4" fill="#1E293B"/>
    <circle cx="500" cy="48" r="2" fill="#38BDF8"/> <!-- 4K Camera Lens -->
    <circle cx="460" cy="48" r="1.5" fill="#64748B"/> <!-- Mic 1 -->
    <circle cx="475" cy="48" r="1.5" fill="#64748B"/> <!-- Mic 2 -->
    <circle cx="525" cy="48" r="1.5" fill="#64748B"/> <!-- Mic 3 -->
    <circle cx="540" cy="48" r="1.5" fill="#64748B"/> <!-- Mic 4 -->

    <!-- Bottom Speaker Grille & Ports Bar -->
    <rect x="68" y="524" width="864" height="32" rx="6" fill="#0B132B"/>
    <circle cx="100" cy="540" r="4" fill="#10B981"/> <!-- Power LED Green -->
    <!-- Front USB & HDMI ports -->
    <rect x="130" y="535" width="14" height="10" rx="2" fill="#334155"/>
    <rect x="152" y="535" width="14" height="10" rx="2" fill="#334155"/>
    <rect x="174" y="536" width="18" height="8" rx="2" fill="#2563EB"/> <!-- Type-C 65W PD -->
    
    <!-- Soundbar pattern dots -->
    <g fill="#334155" opacity="0.6">
      <circle cx="350" cy="540" r="1.5"/><circle cx="360" cy="540" r="1.5"/><circle cx="370" cy="540" r="1.5"/>
      <circle cx="630" cy="540" r="1.5"/><circle cx="640" cy="540" r="1.5"/><circle cx="650" cy="540" r="1.5"/>
    </g>

    <!-- Magnetic Stylus docked on front bar -->
    <rect x="760" y="536" width="90" height="8" rx="4" fill="#64748B" stroke="#94A3B8" stroke-width="0.5"/>
  </g>

  <!-- ON-SCREEN UI: Smart Board 4K OS Interface -->
  <g id="screen-content">
    <!-- Top Bar inside Screen -->
    <rect x="74" y="54" width="852" height="42" fill="#FFFFFF" opacity="0.95"/>
    <line x1="74" y1="96" x2="926" y2="96" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Brand Mini Logo on Screen -->
    <path d="M 95 68 L 105 78 L 95 88 L 85 78 Z" fill="#002B9A"/>
    <text x="115" y="80" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#002B9A">CAHAYA MUSTIKA</text>
    <text x="235" y="80" font-family="Poppins, sans-serif" font-size="10" fill="#64748B">| Interactive Board OS 13</text>

    <!-- Screen Status icons -->
    <rect x="710" y="65" width="56" height="22" rx="11" fill="#EEF2FF"/>
    <text x="722" y="80" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#002B9A">Dual OS</text>
    <rect x="774" y="65" width="70" height="22" rx="11" fill="#ECFDF5"/>
    <text x="784" y="80" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#059669">4K UHD</text>
    <text x="860" y="80" font-family="Poppins, sans-serif" font-weight="600" font-size="11" fill="#1E293B">10:45 WIB</text>

    <!-- Split Workspace on Screen -->
    <!-- Left Workspace: Interactive Presentation / Analytics -->
    <rect x="94" y="112" width="460" height="388" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="114" y="142" font-family="Manrope, sans-serif" font-weight="800" font-size="15" fill="#051336">Laporan Kinerja Digital &amp; Kolaborasi</text>
    <text x="114" y="160" font-family="Poppins, sans-serif" font-size="11" fill="#64748B">Multi-Source Screen Sharing (4 Devices Connected)</text>

    <!-- Mini chart bar 1 -->
    <rect x="114" y="180" width="80" height="110" rx="8" fill="#F1F5F9"/>
    <rect x="122" y="225" width="30" height="65" rx="4" fill="#002B9A"/>
    <rect x="156" y="200" width="30" height="90" rx="4" fill="#3B82F6"/>
    <text x="135" y="305" font-family="Poppins, sans-serif" font-size="10" fill="#64748B">Q1-Q2</text>

    <!-- Mini chart bar 2 -->
    <rect x="206" y="180" width="80" height="110" rx="8" fill="#F1F5F9"/>
    <rect x="214" y="210" width="30" height="80" rx="4" fill="#002B9A"/>
    <rect x="248" y="190" width="30" height="100" rx="4" fill="#10B981"/>
    <text x="227" y="305" font-family="Poppins, sans-serif" font-size="10" fill="#64748B">Q3-Q4</text>

    <!-- Digital Handwriting Annotation (Highlighting Smart Board Feature) -->
    <path d="M 310 185 Q 360 170 410 190 T 520 175" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 505 170 L 525 175 L 515 190" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Handdrawn Circle around peak -->
    <ellipse cx="263" cy="190" rx="20" ry="12" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="320" y="225" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#DC2626">Target Tercapai 142%!</text>
    <text x="320" y="242" font-family="Poppins, sans-serif" font-size="10" fill="#475569">Catatan meeting direksi via stylus pen</text>

    <!-- 4 Device Mirrored thumbnails inside display -->
    <rect x="114" y="330" width="98" height="64" rx="6" fill="#002B9A" opacity="0.08" stroke="#002B9A" stroke-width="1"/>
    <text x="122" y="352" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#002B9A">💻 Laptop 1</text>
    <text x="122" y="372" font-family="Poppins, sans-serif" font-size="9" fill="#475569">Windows 11</text>

    <rect x="222" y="330" width="98" height="64" rx="6" fill="#3B82F6" opacity="0.08" stroke="#3B82F6" stroke-width="1"/>
    <text x="230" y="352" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#1D4ED8">🍎 MacBook</text>
    <text x="230" y="372" font-family="Poppins, sans-serif" font-size="9" fill="#475569">AirPlay 4K</text>

    <rect x="330" y="330" width="98" height="64" rx="6" fill="#10B981" opacity="0.08" stroke="#10B981" stroke-width="1"/>
    <text x="338" y="352" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#059669">📱 iPad Pro</text>
    <text x="338" y="372" font-family="Poppins, sans-serif" font-size="9" fill="#475569">Touch Back</text>

    <rect x="438" y="330" width="98" height="64" rx="6" fill="#8B5CF6" opacity="0.08" stroke="#8B5CF6" stroke-width="1"/>
    <text x="446" y="352" font-family="Manrope, sans-serif" font-weight="700" font-size="10" fill="#6D28D9">🤖 Android</text>
    <text x="446" y="372" font-family="Poppins, sans-serif" font-size="9" fill="#475569">NFC Cast</text>

    <!-- Floating Interactive Whiteboard Toolbar Dock on Screen -->
    <rect x="180" y="440" width="280" height="44" rx="22" fill="#0F172A" opacity="0.95"/>
    <circle cx="210" cy="462" r="12" fill="#002B9A"/>
    <circle cx="242" cy="462" r="12" fill="#DC2626"/>
    <circle cx="274" cy="462" r="12" fill="#10B981"/>
    <circle cx="306" cy="462" r="12" fill="#F59E0B"/>
    <rect x="335" y="450" width="55" height="24" rx="6" fill="#334155"/>
    <text x="345" y="466" font-family="Poppins, sans-serif" font-size="10" fill="#FFFFFF">Pen 40pt</text>
    <rect x="400" y="450" width="45" height="24" rx="6" fill="#3B82F6"/>
    <text x="410" y="466" font-family="Poppins, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">Save</text>

    <!-- Right Workspace: Video Conference Grid (Hybrid Meeting) -->
    <rect x="568" y="112" width="338" height="388" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="568" y="112" width="338" height="38" rx="12 12 0 0" fill="#002B9A"/>
    <text x="586" y="136" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">🎥 Zoom / Teams Hybrid Session (4K)</text>

    <!-- Participant 1 -->
    <rect x="580" y="160" width="150" height="96" rx="8" fill="#1E293B"/>
    <circle cx="655" cy="198" r="22" fill="#475569"/>
    <circle cx="655" cy="192" r="9" fill="#94A3B8"/>
    <path d="M 640 216 Q 655 208 670 216 Z" fill="#94A3B8"/>
    <rect x="586" y="234" width="75" height="16" rx="4" fill="#0F172A" opacity="0.8"/>
    <text x="592" y="246" font-family="Poppins, sans-serif" font-size="9" fill="#F8FAFC">Direktur Utama</text>

    <!-- Participant 2 -->
    <rect x="742" y="160" width="150" height="96" rx="8" fill="#1E293B"/>
    <circle cx="817" cy="198" r="22" fill="#3B82F6"/>
    <circle cx="817" cy="192" r="9" fill="#EFF6FF"/>
    <path d="M 802 216 Q 817 208 832 216 Z" fill="#EFF6FF"/>
    <rect x="748" y="234" width="80" height="16" rx="4" fill="#0F172A" opacity="0.8"/>
    <text x="754" y="246" font-family="Poppins, sans-serif" font-size="9" fill="#F8FAFC">General Manager</text>

    <!-- Participant 3 -->
    <rect x="580" y="266" width="150" height="96" rx="8" fill="#1E293B"/>
    <circle cx="655" cy="304" r="22" fill="#059669"/>
    <circle cx="655" cy="298" r="9" fill="#ECFDF5"/>
    <path d="M 640 322 Q 655 314 670 322 Z" fill="#ECFDF5"/>
    <rect x="586" y="340" width="85" height="16" rx="4" fill="#0F172A" opacity="0.8"/>
    <text x="592" y="352" font-family="Poppins, sans-serif" font-size="9" fill="#F8FAFC">Head of Education</text>

    <!-- Participant 4 -->
    <rect x="742" y="266" width="150" height="96" rx="8" fill="#1E293B"/>
    <circle cx="817" cy="304" r="22" fill="#D97706"/>
    <circle cx="817" cy="298" r="9" fill="#FEF3C7"/>
    <path d="M 802 322 Q 817 314 832 322 Z" fill="#FEF3C7"/>
    <rect x="748" y="340" width="70" height="16" rx="4" fill="#0F172A" opacity="0.8"/>
    <text x="754" y="352" font-family="Poppins, sans-serif" font-size="9" fill="#F8FAFC">IT Specialist</text>

    <!-- Call Control Bar at bottom right -->
    <rect x="620" y="440" width="234" height="42" rx="21" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="650" cy="461" r="14" fill="#002B9A"/>
    <circle cx="690" cy="461" r="14" fill="#002B9A"/>
    <circle cx="730" cy="461" r="14" fill="#10B981"/>
    <circle cx="770" cy="461" r="14" fill="#3B82F6"/>
    <circle cx="815" cy="461" r="14" fill="#DC2626"/>
  </g>

  <!-- Floating Quality Badge Overlap -->
  <g transform="translate(40, 20)">
    <rect width="180" height="52" rx="12" fill="#FFFFFF" stroke="#002B9A" stroke-width="1.5" filter="url(#shadowHeavy)"/>
    <circle cx="30" cy="26" r="16" fill="#EEF2FF"/>
    <path d="M 30 16 L 33 22 L 40 23 L 35 28 L 36 35 L 30 31 L 24 35 L 25 28 L 20 23 L 27 22 Z" fill="#002B9A"/>
    <text x="56" y="24" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#002B9A">GARANSI RESMI 3 THN</text>
    <text x="56" y="40" font-family="Poppins, sans-serif" font-size="10" fill="#475569">After Sales Cahaya Mustika</text>
  </g>

  <g transform="translate(760, 470)">
    <rect width="190" height="56" rx="12" fill="#002B9A" filter="url(#shadowHeavy)"/>
    <text x="20" y="25" font-family="Manrope, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">TERSEDIA DI E-KATALOG</text>
    <text x="20" y="42" font-family="Poppins, sans-serif" font-size="10" fill="#BAE6FD">LKPP &amp; Bersertifikat TKDN</text>
  </g>
</svg>
